<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="420" height="160">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5cb800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a8500;stop-opacity:1" />
    </linearGradient>
    <style>
      .logo-stan { font-family: 'Arial Black', 'Impact', sans-serif; font-weight: 900; }
    </style>
  </defs>

  <!-- ─── ICON MARK ─── -->
  <!-- Outer circle swoosh (dark charcoal arc) -->
  <path d="M 75,15 A 60,60 0 1,1 135,75 A 60,60 0 0,1 75,135" 
        fill="none" stroke="#1a2332" stroke-width="7" stroke-linecap="round"/>

  <!-- S letter (green) -->
  <text x="48" y="104" font-family="'Arial Black','Impact',sans-serif" font-weight="900" 
        font-size="72" fill="url(#greenGrad)" letter-spacing="-4">S</text>

  <!-- T letter (dark charcoal, overlapping) -->
  <text x="89" y="104" font-family="'Arial Black','Impact',sans-serif" font-weight="900"
        font-size="72" fill="#1a2332" letter-spacing="-4">T</text>

  <!-- Circuit traces from S (left side) -->
  <g stroke="#5cb800" stroke-width="1.8" fill="none" stroke-linecap="round">
    <line x1="44" y1="62" x2="20" y2="62"/>
    <line x1="20" y1="62" x2="12" y2="55"/>
    <circle cx="11" cy="55" r="2.5" fill="#5cb800"/>

    <line x1="44" y1="74" x2="18" y2="74"/>
    <line x1="18" y1="74" x2="10" y2="67"/>
    <circle cx="9" cy="67" r="2.5" fill="#5cb800"/>

    <line x1="44" y1="86" x2="16" y2="86"/>
    <line x1="16" y1="86" x2="8" y2="79"/>
    <circle cx="7" cy="79" r="2.5" fill="#5cb800"/>
  </g>

  <!-- Pixel dots from T (top right dissolving) -->
  <g fill="#5cb800" opacity="0.9">
    <rect x="133" y="18" width="7" height="7" rx="1"/>
    <rect x="143" y="14" width="5" height="5" rx="1"/>
    <rect x="136" y="10" width="4" height="4" rx="1"/>
    <rect x="148" y="23" width="4" height="4" rx="1"/>
    <rect x="155" y="16" width="3" height="3" rx="1"/>
    <rect x="143" y="27" width="3" height="3" rx="1"/>
    <rect x="152" y="9"  width="3" height="3" rx="1"/>
  </g>

  <!-- ─── WORDMARK ─── -->
  <!-- STAN (dark) -->
  <text x="165" y="82" font-family="'Arial Black','Impact',sans-serif" font-weight="900"
        font-size="52" fill="#1a2332" letter-spacing="1">STAN</text>

  <!-- TECH (green) -->
  <text x="297" y="82" font-family="'Arial Black','Impact',sans-serif" font-weight="900"
        font-size="52" fill="url(#greenGrad)" letter-spacing="1">TECH</text>

  <!-- Tagline -->
  <!-- Left line -->
  <line x1="165" y1="97" x2="180" y2="97" stroke="#5cb800" stroke-width="1.5"/>
  <!-- Tagline text -->
  <text x="185" y="101" font-family="Arial,sans-serif" font-size="9" font-weight="600"
        fill="#555" letter-spacing="2.5">SOLUTIONS TECHNOLOGIQUES MODERNES</text>
  <!-- Right line -->
  <line x1="396" y1="97" x2="411" y2="97" stroke="#5cb800" stroke-width="1.5"/>
</svg>
